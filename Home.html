<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content:flex-end;
            height: 95vh;
            background-image: url('second image.jpg'); 
            background-size: cover;
            background-position: center;
            color: white;
        }
        input {
            padding: 10px;
